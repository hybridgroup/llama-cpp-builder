name: Publish Version Page

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # The build workflow calls this after a release. A deployment can still be lost,
  # such as when the release came from a run that the github-pages environment did
  # not permit to deploy. Run this by hand from main to put the site back in step
  # with a release that is already published.
  workflow_dispatch:
    inputs:
      tag_name:
        description: The release tag that the version page names
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish-version:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Each deployment replaces the whole site, so the manifests must come from the
      # repo. A manifest that is only on the site would go away at the next release.
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Create version JSON
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          # A version file carries the digest of the manifest for its tag, so a client
          # can pin the release without a GitHub API request. A tag with no manifest
          # gets the tag alone, as before.
          write_version() {
            local tag="$1" out="$2"
            local manifest="digests/${tag}.json"
            if [ -n "$tag" ] && [ -f "$manifest" ]; then
              local digest
              digest=$(sha256sum "$manifest" | cut -d' ' -f1)
              printf '{"tag_name":"%s","manifest_sha256":"%s","pin":"%s@sha256:%s"}\n' \
                "$tag" "$digest" "$tag" "$digest" > "$out"
            else
              printf '{"tag_name":"%s"}\n' "$tag" > "$out"
            fi
            cat "$out"
          }
          write_version "${{ inputs.tag_name }}" _site/version.json
          PREV_TAG=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r --arg current "${{ inputs.tag_name }}" \
              '[.[] | select(.draft == false) | select(.tag_name != $current)]
               | sort_by(.published_at) | last | .tag_name')
          if [ "$PREV_TAG" = "null" ]; then PREV_TAG=""; fi
          write_version "$PREV_TAG" _site/previous.json
      - name: Copy the digest manifests
        run: |
          if [ -d digests ]; then
            cp -R digests _site/digests
            echo "published $(ls _site/digests | wc -l) manifests"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

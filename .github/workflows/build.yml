  # build-wasm makes the WebAssembly build that yzma uses in a browser, through
  # its pkg/llamawasm package. It shares nothing with the native jobs: no GCC
  # from source, no GPU SDK, and the output is yzma_wasm.js and yzma_wasm.wasm
  # instead of a set of dlopen libraries.
  build-wasm:
    needs: check-version
    if: ${{ needs.check-version.outputs.should-build == 'true' }}
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.8
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Checkout llama.cpp repo
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp
          ref: ${{ needs.check-version.outputs.llama-tag }}
          fetch-tags: 'true'
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build git python3
      - name: Cache Emscripten SDK
        uses: actions/cache@v5
        id: cache-emsdk
        with:
          path: ./emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-ubuntu-latest-v1
      - name: Install Emscripten SDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${EMSDK_VERSION} https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install ${EMSDK_VERSION}
          ./emsdk activate ${EMSDK_VERSION}
      - name: Build single thread
        run: |
          source ./emsdk/emsdk_env.sh
          wasm/build.sh --llama-cpp "$GITHUB_WORKSPACE/llama.cpp" --out "$GITHUB_WORKSPACE/out/wasm-simd"
      - name: Build multiple threads
        run: |
          source ./emsdk/emsdk_env.sh
          wasm/build.sh --mt --llama-cpp "$GITHUB_WORKSPACE/llama.cpp" --out "$GITHUB_WORKSPACE/out/wasm-simd-mt"
      # The WebGPU backend of llama.cpp follows one commit of Dawn, so the
      # emdawnwebgpu package is pinned. wasm/build.sh holds the tag, and it
      # downloads the package itself if the cache has none.
      - name: Read the pinned Dawn tag
        id: dawn
        run: |
          TAG=$(sed -n 's/^DAWN_TAG="${DAWN_TAG:-\(.*\)}"$/\1/p' wasm/build.sh)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "emdawnwebgpu tag: $TAG"
      - name: Cache emdawnwebgpu
        uses: actions/cache@v5
        id: cache-emdawn
        with:
          path: ./build-wasm/emdawnwebgpu_pkg
          key: emdawnwebgpu-${{ steps.dawn.outputs.tag }}-v1
      - name: Build WebGPU
        run: |
          source ./emsdk/emsdk_env.sh
          wasm/build.sh --webgpu --llama-cpp "$GITHUB_WORKSPACE/llama.cpp" --out "$GITHUB_WORKSPACE/out/wasm-webgpu"
      - name: Pack artifacts
        run: |
          tar -czvf llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd.tar.gz --transform "s,./,llama-${{ needs.check-version.outputs.llama-tag }}/," -C ./out/wasm-simd .
          tar -czvf llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd-mt.tar.gz --transform "s,./,llama-${{ needs.check-version.outputs.llama-tag }}/," -C ./out/wasm-simd-mt .
          tar -czvf llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-webgpu.tar.gz --transform "s,./,llama-${{ needs.check-version.outputs.llama-tag }}/," -C ./out/wasm-webgpu .
      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          path: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd.tar.gz
          name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd.tar.gz
          archive: false
      - name: Upload multiple thread release binaries
        uses: actions/upload-artifact@v7
        with:
          path: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd-mt.tar.gz
          name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd-mt.tar.gz
          archive: false
      - name: Upload WebGPU release binaries
        uses: actions/upload-artifact@v7
        with:
          path: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-webgpu.tar.gz
          name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-webgpu.tar.gz
          archive: false

  release:
    needs: 
      - check-version
      - build-cuda-amd64
      - build-cuda-13-amd64
      - build-cuda-arm64
      - build-cuda-13-arm64
      - build-vulkan-arm64
      - build-trixie-vulkan-arm64
      - build-cpu-arm64
      - build-trixie-cpu-arm64
      - build-trixie-opencl-arm64
      - build-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
      - name: Download amd64 CUDA artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-x64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-x64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download amd64 CUDA 13 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-x64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-x64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download arm64 CUDA artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-arm64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download arm64 CUDA 13 artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-arm64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cuda-13-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download arm64 Vulkan artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-vulkan-arm64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-vulkan-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download arm64 Vulkan trixie artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-trixie-vulkan-arm64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-trixie-vulkan-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download arm64 CPU artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cpu-arm64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-cpu-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download arm64 trixie CPU artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-trixie-cpu-arm64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-trixie-cpu-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download arm64 trixie OpenCL artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-trixie-opencl-arm64.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-ubuntu-trixie-opencl-arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download wasm artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download wasm multiple thread artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd-mt.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-simd-mt.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download wasm WebGPU artifact
        uses: ./.github/actions/download-artifact
        with:
          run-id: ${{ github.run_id }}
          artifact-name: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-webgpu.tar.gz
          destination: llama-${{ needs.check-version.outputs.llama-tag }}-bin-wasm-webgpu.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create final release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check-version.outputs.llama-tag }}
          commit: main
          makeLatest: true
          body: |
            ## Changes in llama.cpp ${{ needs.check-version.outputs.llama-tag }}
            See the [llama.cpp releases](https://github.com/ggml-org/llama.cpp/releases/tag/${{ needs.check-version.outputs.llama-tag }}) for details.
          artifacts: "*.tar.gz"

  publish-version:
    needs:
      - check-version
      - release
    uses: ./.github/workflows/publish-version.yml
    with:
      tag_name: ${{ needs.check-version.outputs.llama-tag }}
    permissions:
      contents: read
      pages: write
      id-token: write

  trigger-yzma-tests:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger yzma repo Linux build
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{secrets.YZMA_BUILD_ACCESS}}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/hybridgroup/yzma/actions/workflows/linux.yml/dispatches \
          -d '{"ref": "main"}'
      - name: Trigger yzma repo macOS build
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{secrets.YZMA_BUILD_ACCESS}}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/hybridgroup/yzma/actions/workflows/macos.yml/dispatches \
          -d '{"ref": "main"}'
      - name: Trigger yzma repo Windows build
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{secrets.YZMA_BUILD_ACCESS}}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/hybridgroup/yzma/actions/workflows/windows.yml/dispatches \
          -d '{"ref": "main"}'
      - name: Trigger yzma repo FFI checker
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{secrets.YZMA_BUILD_ACCESS}}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/hybridgroup/yzma/actions/workflows/checker.yml/dispatches \
          -d '{"ref": "main"}'
